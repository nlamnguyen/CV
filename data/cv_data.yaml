summary:
  - "Actuellement, je suis à la recherche d’un poste de développeur python."
  - >
    Passionné par les sciences, après une licence de chimie j’ai opté pour un master en
    Chemoinformatique. Cette discipline à l’interface entre physique, chimie, biologie,
    pharmacologie et informatique m’a offert la possibilité de développer des compétences
    dans ces domaines passionnants en même temps. Au cours de mes études j’ai développé un
    intérêt pour les problématiques liées au développement de médicaments (criblage virtuel,
    prédiction de cibles thérapeutiques, …).
  - >
    J’ai eu l’opportunité de valider ces intérêts dans mon parcours professionnel au sein
    d’équipes pluridisciplinaires que je trouve riches autant sur le plan humain que sur le
    plan intellectuel. Le travail à l’interface des domaines requiert de nombreux outils
    pratiques, théoriques et une capacité d’adaptation que j’ai toujours su démontrer. En
    raison d’une curiosité naturelle et du plaisir de répondre aux attentes de mes collègues,
    je me suis toujours rapidement adapté aux techniques, aux logiciels ou aux langages de
    programmation en vigueur dans les équipes que j’ai intégrées.

experiences:
  - title: "Développeur Python"
    time: "mars 2021 - mai 2024"
    company: "Roederer"
    company_href: null
    assignment_title: >
      Améliorations de l’ERP, automatisation des traitements d’indemnisation des assurés,
      convergence vers le modèle Qwitus, formation de nouveaux collaborateurs et d’un
      alternant, support technique niveau 2 et support d’anomalie en production et maintenance.
    paragraphs:
      - >
        L’ERP est basé sur le framework Tryton, il permet de réaliser des remboursements à
        des personnes ou entreprises en prévoyance.<br>Je suis chargé de faire des correctifs,
        des améliorations et des automatisations du programme. J’ai effectué l’automatisation
        des paiements d’indemnisations des cas simple lors de la réception des BPIJ de la
        caisse maladie. J’ai participé aux envoies et relances automatiques des courriers, la
        convergence vers le nouveau modèle Qwitus.<br>L’aide support technique niveau 2 m’a
        permis de détecter les bugs, les améliorations du programme et de mieux comprendre le
        métier de gestionnaire de prévoyance.<br>Je participe également aux formations des
        nouveaux arrivants. J’ai suivi un alternant: dans le choix des sujets, l’aider dans
        les concepts métiers et modèles, dans son développement.
    tools: "Technologies : Bash, Docker, Git, PSQL, Python, Tryton.<br>Autres: Jira (gestion de projets), GLPI (gestion de tickets), Méthodes agiles, Scrum."

  - title: "Formation Data Scientist & Stage chez Devis Plus"
    time: "oct. 2019 - avril 2020"
    company: "ECAM"
    company_href: null
    assignment_title: "Exploitation des données industrielles et optimisation de l’activité"
    paragraphs:
      - >
        Cette formation m’a permis d’approfondir mes connaissances dans le domaine de
        l’apprentissage automatique et élargir le domaine d’applicabilité des prédictions.
        J’ai pu découvrir des applications de visualisation de données, qui m’ont grandement
        surpris par la simplicité et l’interactivité (Tableau et power BI).<br>J’ai pu mettre
        en pratique mes connaissances et compétences acquises chez Devis Plus, une entreprise
        spécialisé dans les travaux habitations.
    tools: "Technologies : CSS, HTML, Java, MySQL, Power BI, Python, R, Scikit-Learn, Tableau, TensorFlow, Watson."

  - title: "Ingénieur de recherche en Bio-Informatique"
    time: "déc. 2015 - nov. 2018"
    company: "Bionext"
    company_href: null
    assignment_title: "Optimisation et validation du programme BioSight:"
    paragraphs:
      - >
        BioSight est un programme de comparaison de similarité de surfaces de protéines.
        J’ai créé un jeu de données (Bionext-DSS) permettant d’optimiser et d’évaluer la
        similarité trouvée par le programme.
      - >
        Pour valider le programme, j’ai effectué différentes tâches:<br> - Les validations
        des cas d’études (évaluation de la superposition 3D et des appariements d’atomes).
        <br> - Le cas d’étude de la Clomipramine, j’ai participé à la sélection des cibles à
        intérêt thérapeutique pour la validation <span class="italic">in vitro</span>.
        <br> - Nous avons intégré différentes bases de données (Chembl, Drugbank, …) qui
        contient des informations d’activité entre le ligand et la protéine. Ces informations
        nous confortent dans la validation du programme quand les premières protéines
        trouvées possèdent des ligands communs.<br> - Nous avons fait un
        <span class="italic">clustering</span> des séquences de protéines qui nous a permis
        d’expliquer certains écarts de score observé.
      - >
        Pour répondre aux besoins de nos collaborateurs, j’ai analysé des résultats de
        <span class="italic">docking</span> et implémenté des scripts pour faciliter
        l’utilisation du programme <a href="http://rdock.sourceforge.net/"> Rdock </a>:
        <br>- Générer automatiquement des structures 3D de différents chimiothèques et les
        utiliser pour Rdock.<br>- Sélectionner et extraire les résultats de docking pour
        l’analyse visuelle.
    tools: "Technologies : Blast, CDK, Chemaxon, Java, MySQL, OpenBabel, Python, RDkit, Rdock, Vina"

  - title: "Modélisateur"
    time: "févr. - août 2012"
    company: "Greenpharma"
    company_href: "http://www.greenpharma.com/"
    assignment_title: "Criblage virtuel basé sur la structure de ligands:"
    paragraphs:
      - >
        En se basant sur les informations de ligands-protéines de la base de données Chembl
        et de GreeenPharma, j’ai développé et automatisé un protocole de repositionnement de
        médicament. En partant d’une molécule de synthèse ou naturel, le programme prédit les
        protéines potentiellement actives.
    tools: "Technologies : CDK, Chemaxon, Java, Knime, MOE, MySQL, OpenBabel, Tripos"

  - title: "Modélisateur"
    time: "mai 2011 - janv. 2012"
    company: "Laboratoire d’Infochimie de Strasbourg"
    company_href: "http://infochim.u-strasbg.fr/"
    assignment_title: "Echantillonnage conformationnel de ligands bioactifs:"
    paragraphs:
      - >
        <a href="https://www.theses.fr/172411920">S4mple</a> est un programme de docking
        développé par Laurent Hoffer lors de sa thèse au laboratoire d’infochimie. J’ai
        évalué, optimisé les paramètres et validé l’échantillonnage conformationnel des
        molécules (reproduction de conformation bioactive). J’ai également comparé S4ample à
        la concurrence en utilisant la base de données de DUD
        <span class="italic">(a Directory of Useful Decoys)</span>.
    tools: "Technologies : Awk, Chemaxon, MOE, Python, OpenBabel, TCL"

  - title: "Découverte de la modélisation moléculaire"
    time: "avr. - juin 2010 (stage)"
    company: "Laboratoire d’Infochimie de Strasbourg"
    company_href: "http://infochim.u-strasbg.fr/"
    assignment_title: "Modélisation des Calix-4-arène et Calix-6-arène avec des alcalins:"
    paragraphs:
      - >
        En utilisant différents programmes de dynamique moléculaire, les Calix-arènes sont
        modélisés avec différent champs de force. Le but est cherché le meilleur modèle pour
        reproduire les valeurs observées en cristallographie. Ce stage m’a permis renforcer
        mon choix du master et de découvrir le monde de la modélisation moléculaire
    tools: "Technologies : Macromodel, Spartan"

achievements:
  - title: "Bionext-DSS"
    href: "https://www.bionext.com/communications/20170725_dss_lam/"
    description: >
      Le jeu de données a été créé pour nous permettre d’évaluer la similarité de site et de
      vérifier si le site actif est trouvé. En me basant sur le principe « un ligand similaire
      se lie à une cible similaire », j’ai aligné manuellement et à l’aide de Cealign les
      sites de protéine possédant le même ligand. J’ai évalué les atomes et résidus similaires
      et attribué une classification allant de zéro à cinq. Sachant que zéro correspond à la
      protéine de référence et les protéines dissimilaires sont classées en cinq.

